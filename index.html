<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omni-Cult Sticker Order Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f9fafb;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .card {
      background: #0b1120;
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid #1f2937;
      margin-bottom: 12px;
    }

    .order-grid { display: grid; gap: 10px; }
    @media (min-width: 720px) {
      .order-grid { grid-template-columns: repeat(2, 1fr); }
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }

    textarea { min-height: 70px; resize: vertical; }

    .search-row {
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .search-row label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #d1d5db;
    }
    .search-row input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }

    /* FIXED EVEN GRID */
    .gallery {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 14px;
    }
    @media (min-width: 900px) {
      .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .design-card {
      border-radius: 10px;
      padding: 6px;
      border: 1px solid #1f2937;
      background: #020617;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
    }

    .design-card.selected {
      border-color: #22c55e;
      box-shadow: 0 0 6px rgba(34,197,94,0.5);
    }

    .design-card.placeholder {
      visibility: hidden;
      border: none;
      box-shadow: none;
    }

    .thumb-wrapper {
      background: #020617;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .design-name {
      font-size: 0.75rem;
      text-align: center;
      color: #e5e7eb;
    }

    .design-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 0.7rem;
    }

    .design-controls select {
      width: 62px;
      padding: 3px 5px;
      font-size: 0.7rem;
      background: #020617;
      color: #f9fafb;
      border-radius: 6px;
      border: 1px solid #374151;
    }

    .submit-btn {
      margin-top: 14px;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #020617;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }

    .submit-btn:hover { filter: brightness(1.07); }

    .load-more-wrap {
      text-align: center;
      margin-top: 14px;
    }

    .load-more-btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #22c55e;
      background: #0b1120;
      font-weight: 700;
      color: #22c55e;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .load-more-btn:hover { background: #111827; }

    .status {
      margin-top: 6px;
      font-size: 0.75rem;
    }
    .status.error { color: #fecaca; }

    .small-note { font-size: 0.75rem; color: #9ca3af; }
    .disclaimer { font-size: 0.75rem; color: #6b7280; margin-top: 4px; text-align: right; }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <h1>Omni-Cult Sticker Order Form</h1>
      <p>Select stickers, tick the box, and choose quantities (0–99). Colors may vary; pink line = sticker shape.</p>
    </header>

    <form
      id="orderForm"
      class="card"
      method="POST"
      action="https://formspree.io/f/mykdggqy"
    >
      <!-- redirect back to success page after a good submit -->
      <input
        type="hidden"
        name="_redirect"
        value="https://omnicultcs-droid.github.io/Omni-Cult-Sticker-Order-Form/success.html"
      />
      <input type="hidden" name="items" id="itemsField">

      <div class="order-grid">
        <div>
          <label>Name</label>
          <input name="name" type="text" required>
        </div>
        <div>
          <label>Email</label>
          <input name="email" type="email" required>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label>Order notes</label>
        <textarea name="notes"></textarea>
      </div>

      <div class="search-row">
        <label>Search stickers</label>
        <input id="searchInput" type="search" placeholder="Type to filter… e.g. germs, skull, anime" />
      </div>

      <div id="gallery" class="gallery"></div>

      <div class="load-more-wrap">
        <button type="button" id="loadMoreBtn" class="load-more-btn">LOAD MORE</button>
      </div>

      <p id="galleryStatus" class="small-note"></p>

      <p class="disclaimer">colors may vary; pink line = cutline.</p>

      <button type="submit" class="submit-btn">Submit order</button>
      <div id="formStatus" class="status"></div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const PAGE_SIZE = 120;
      const gallery = document.getElementById("gallery");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const searchInput = document.getElementById("searchInput");
      const itemsField = document.getElementById("itemsField");
      const formStatus = document.getElementById("formStatus");

      let all = [];
      let filtered = [];
      let count = 0;
      const selections = {};

      fetch("designs.json")
        .then(r => r.json())
        .then(data => {
          all = data.map((d, i) => {
            const raw = d.img || d.image || d.src || d.file || "";
            const name = raw.substring(raw.lastIndexOf("/") + 1).replace(/\.[^.]+$/, "");
            const img = raw.includes("/") ? raw : "img/" + raw;
            return { key: i, name: name.toLowerCase(), display: name, img };
          });
          all.sort((a,b)=>a.display.localeCompare(b.display));
          filtered = all.slice();
          renderMore();
        });

      function renderMore() {
        const next = filtered.slice(count, count + PAGE_SIZE);
        next.forEach(addCard);
        count += next.length;
        padGrid();
        if (count >= filtered.length) loadMoreBtn.style.display = "none";
      }

      function addCard(design) {
        const card = document.createElement("div");
        card.className = "design-card";

        const checkboxName = `design_${design.key}_sel`;
        const qtyName = `design_${design.key}_qty`;

        card.innerHTML = `
          <div class="thumb-wrapper"><img src="${design.img}"></div>
          <div class="design-name">${design.display}</div>
          <div class="design-controls">
            <label><input type="checkbox" name="${checkboxName}" value="1"> Select</label>
            <label>Qty
              <select name="${qtyName}">
                ${Array.from({length:100},(_,x)=>`<option value="${x}">${x}</option>`).join("")}
              </select>
            </label>
          </div>
        `;

        const checkbox = card.querySelector(`input[name="${checkboxName}"]`);
        const qty = card.querySelector(`select[name="${qtyName}"]`);

        checkbox.addEventListener("change", () => {
          if (checkbox.checked && qty.value === "0") qty.value = "1";
          update(design.key, qty.value, checkbox.checked, card);
        });

        qty.addEventListener("change", () => {
          checkbox.checked = qty.value !== "0";
          update(design.key, qty.value, checkbox.checked, card);
        });

        gallery.appendChild(card);
      }

      function update(key, qty, isChecked, card) {
        const n = parseInt(qty, 10);
        if (isChecked && n > 0) {
          selections[key] = n;
          card.classList.add("selected");
        } else {
          delete selections[key];
          card.classList.remove("selected");
        }
      }

      function padGrid() {
        const cols = getComputedStyle(gallery).gridTemplateColumns.split(" ").length;
        const real = gallery.querySelectorAll(".design-card:not(.placeholder)").length;
        const rem = real % cols;
        gallery.querySelectorAll(".placeholder").forEach(p => p.remove());
        if (rem !== 0) {
          for (let i = 0; i < cols - rem; i++) {
            const ph = document.createElement("div");
            ph.className = "design-card placeholder";
            gallery.appendChild(ph);
          }
        }
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase().trim();
        gallery.innerHTML = "";
        count = 0;
        filtered = q ? all.filter(d => d.display.includes(q)) : all.slice();
        loadMoreBtn.style.display = filtered.length > PAGE_SIZE ? "inline-block" : "none";
        renderMore();
      });

      loadMoreBtn.addEventListener("click", renderMore);

      document.getElementById("orderForm").addEventListener("submit", e => {
        const items = Object.entries(selections)
          .map(([k,v]) => {
            const d = all.find(x => x.key == k);
            return `${d.display} x ${v}`;
          });

        if (!items.length) {
          e.preventDefault();
          formStatus.textContent = "Select at least one sticker.";
          formStatus.classList.add("error");
          return;
        }

        itemsField.value = items.join("\n");
      });

      window.addEventListener("resize", padGrid);
    });
  </script>

</body>
</html>
