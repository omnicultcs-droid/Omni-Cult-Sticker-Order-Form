<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omni-Cult Sticker Order Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f9fafb;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .card {
      background: #0b1120;
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid #1f2937;
      margin-bottom: 12px;
    }

    .order-grid { display: grid; gap: 10px; }
    @media (min-width: 720px) {
      .order-grid { grid-template-columns: repeat(2, 1fr); }
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }

    textarea { min-height: 70px; resize: vertical; }

    .search-row {
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .search-row label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #d1d5db;
    }
    .search-row input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }

    /* Selection summary + clear-all */
    .selection-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #9ca3af;
      gap: 8px;
      flex-wrap: wrap;
    }
    .selection-summary {
      font-size: 0.8rem;
    }
    .clear-btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #ef4444;
      background: transparent;
      color: #fecaca;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #111827;
    }

    /* Gallery grid */
    .gallery {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 14px;
    }
    @media (min-width: 900px) {
      .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .design-card {
      border-radius: 10px;
      padding: 6px;
      border: 1px solid #1f2937;
      background: #020617;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      position: relative;
    }

    .design-card.selected {
      border-color: #22c55e;
      box-shadow: 0 0 6px rgba(34,197,94,0.5);
    }

    .design-card.placeholder {
      visibility: hidden;
      border: none;
      box-shadow: none;
    }

    .thumb-wrapper {
      background: #020617;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .design-name {
      font-size: 0.75rem;
      text-align: center;
      color: #e5e7eb;
    }

    .design-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 0.7rem;
    }

    .design-controls select {
      width: 62px;
      padding: 3px 5px;
      font-size: 0.7rem;
      background: #020617;
      color: #f9fafb;
      border-radius: 6px;
      border: 1px solid #374151;
    }

    /* Per-card remove button */
    .design-footer {
      margin-top: 6px;
      display: flex;
      justify-content: flex-end;
    }
    .remove-btn {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: transparent;
      color: #9ca3af;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .remove-btn:hover {
      border-color: #ef4444;
      color: #fecaca;
    }

    .submit-btn {
      margin-top: 14px;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #020617;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }

    .submit-btn:hover { filter: brightness(1.07); }

    .load-more-wrap {
      text-align: center;
      margin-top: 14px;
    }

    .load-more-btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #22c55e;
      background: #0b1120;
      font-weight: 700;
      color: #22c55e;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .load-more-btn:hover { background: #111827; }

    .status {
      margin-top: 6px;
      font-size: 0.75rem;
    }
    .status.error { color: #fecaca; }

    .small-note { font-size: 0.75rem; color: #9ca3af; }
    .disclaimer { font-size: 0.75rem; color: #6b7280; margin-top: 4px; text-align: right; }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <h1>Omni-Cult Sticker Order Form</h1>
      <p>Select stickers, tick the box, and choose quantities (0–99). Colors may vary; pink line = sticker shape.</p>
    </header>

    <form
      id="orderForm"
      class="card"
      method="POST"
      action="https://formspree.io/f/mykdggqy"
    >
      <!-- redirect back to success page after a good submit -->
      <input
        type="hidden"
        name="_redirect"
        value="https://omnicultcs-droid.github.io/Omni-Cult-Sticker-Order-Form/success.html"
      />
      <!-- Clean list of selections goes here -->
      <input type="hidden" name="items" id="itemsField">

      <div class="order-grid">
        <div>
          <label>Name</label>
          <input name="name" type="text" required>
        </div>
        <div>
          <label>Email</label>
          <!-- This 'email' field is what Formspree uses for reply-to and autoresponse -->
          <input name="email" type="email" required>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label>Order notes</label>
        <textarea name="notes"></textarea>
      </div>

      <div class="search-row">
        <label>Search stickers</label>
        <input id="searchInput" type="search" placeholder="Type to filter… e.g. germs, skull, anime" />
      </div>

      <div class="selection-bar">
        <div id="selectionSummary" class="selection-summary">
          No stickers selected yet.
        </div>
        <button type="button" id="clearSelectionsBtn" class="clear-btn">
          Remove all selections
        </button>
      </div>

      <div id="gallery" class="gallery"></div>

      <div class="load-more-wrap">
        <button type="button" id="loadMoreBtn" class="load-more-btn">LOAD MORE</button>
      </div>

      <p id="galleryStatus" class="small-note"></p>

      <p class="disclaimer">colors may vary; pink line = cutline.</p>

      <button type="submit" class="submit-btn">Submit order</button>
      <div id="formStatus" class="status"></div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const PAGE_SIZE = 120;
      const STORAGE_KEY = "omniCultStickerSelections_v1";

      const gallery = document.getElementById("gallery");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const searchInput = document.getElementById("searchInput");
      const itemsField = document.getElementById("itemsField");
      const formStatus = document.getElementById("formStatus");
      const selectionSummary = document.getElementById("selectionSummary");
      const clearSelectionsBtn = document.getElementById("clearSelectionsBtn");

      let all = [];
      let filtered = [];
      let count = 0;
      let selections = loadSelections();

      // Load from localStorage
      function loadSelections() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          const obj = JSON.parse(raw);
          if (!obj || typeof obj !== "object") return {};
          const cleaned = {};
          Object.keys(obj).forEach(k => {
            const n = parseInt(obj[k], 10);
            if (!isNaN(n) && n > 0) {
              cleaned[String(k)] = n;
            }
          });
          return cleaned;
        } catch (e) {
          return {};
        }
      }

      function saveSelections() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selections));
        } catch (e) {
          // ignore storage errors
        }
        updateSelectionSummary();
      }

      function updateSelectionSummary() {
        const keys = Object.keys(selections);
        if (!keys.length) {
          selectionSummary.textContent = "No stickers selected yet.";
          return;
        }
        let totalQty = 0;
        keys.forEach(k => {
          const n = parseInt(selections[k], 10) || 0;
          totalQty += n;
        });
        const countDesigns = keys.length;
        selectionSummary.textContent =
          `Selected: ${countDesigns} design${countDesigns !== 1 ? "s" : ""}, ` +
          `${totalQty} sticker${totalQty !== 1 ? "s" : ""} total.`;
      }

      // Initial summary based on whatever is in localStorage
      updateSelectionSummary();

      // Load designs.json and normalize names for fuzzy-ish search
      fetch("designs.json")
        .then(r => r.json())
        .then(data => {
          all = data.map((d, i) => {
            const raw = d.img || d.image || d.src || d.file || "";
            const base = raw.substring(raw.lastIndexOf("/") + 1).replace(/\.[^.]+$/, "");
            const display = base;
            const search = base.toLowerCase();
            const norm = search.replace(/[^a-z0-9]+/g, "");
            const img = raw.includes("/") ? raw : "img/" + raw;
            return { key: i, display, search, norm, img };
          });
          all.sort((a, b) => a.display.localeCompare(b.display));
          filtered = all.slice();
          renderMore();
        })
        .catch(err => {
          console.error("Error loading designs.json", err);
          formStatus.textContent = "Error loading sticker list.";
          formStatus.classList.add("error");
        });

      function renderMore() {
        const next = filtered.slice(count, count + PAGE_SIZE);
        next.forEach(addCard);
        count += next.length;
        padGrid();
        if (count >= filtered.length) loadMoreBtn.style.display = "none";
      }

      function addCard(design) {
        const card = document.createElement("div");
        card.className = "design-card";

        card.innerHTML = `
          <div class="thumb-wrapper"><img src="${design.img}" alt="${design.display}"></div>
          <div class="design-name">${design.display}</div>
          <div class="design-controls">
            <label>
              <input
                type="checkbox"
                class="design-select"
                data-key="${design.key}"
              >
              Select
            </label>
            <label>Qty
              <select class="design-qty" data-key="${design.key}">
                ${Array.from({length:100},(_,x)=>`<option value="${x}">${x}</option>`).join("")}
              </select>
            </label>
          </div>
          <div class="design-footer">
            <button type="button" class="remove-btn" data-key="${design.key}">
              remove from order
            </button>
          </div>
        `;

        const checkbox = card.querySelector(".design-select");
        const qty = card.querySelector(".design-qty");
        const removeBtn = card.querySelector(".remove-btn");
        const keyStr = String(design.key);

        // Restore previous selection state, if any
        if (Object.prototype.hasOwnProperty.call(selections, keyStr)) {
          const existingQty = selections[keyStr];
          checkbox.checked = true;
          qty.value = String(existingQty);
          card.classList.add("selected");
        }

        checkbox.addEventListener("change", () => {
          if (checkbox.checked && qty.value === "0") qty.value = "1";
          updateSelection(keyStr, qty.value, checkbox.checked, card);
        });

        qty.addEventListener("change", () => {
          checkbox.checked = qty.value !== "0";
          updateSelection(keyStr, qty.value, checkbox.checked, card);
        });

        removeBtn.addEventListener("click", () => {
          // remove just this sticker
          delete selections[keyStr];
          checkbox.checked = false;
          qty.value = "0";
          card.classList.remove("selected");
          saveSelections();
        });

        gallery.appendChild(card);
      }

      function updateSelection(keyStr, qty, isChecked, card) {
        const n = parseInt(qty, 10);
        if (isChecked && n > 0) {
          selections[keyStr] = n;
          card.classList.add("selected");
        } else {
          delete selections[keyStr];
          card.classList.remove("selected");
        }
        saveSelections();
      }

      function padGrid() {
        const cols = getComputedStyle(gallery).gridTemplateColumns.split(" ").length;
        const real = gallery.querySelectorAll(".design-card:not(.placeholder)").length;
        const rem = real % cols;
        gallery.querySelectorAll(".placeholder").forEach(p => p.remove());
        if (rem !== 0) {
          for (let i = 0; i < cols - rem; i++) {
            const ph = document.createElement("div");
            ph.className = "design-card placeholder";
            gallery.appendChild(ph);
          }
        }
      }

      // Clear all selections with confirmation
      clearSelectionsBtn.addEventListener("click", () => {
        if (!Object.keys(selections).length) return;
        const sure = window.confirm("Are you sure you want to remove all selections?");
        if (!sure) return;

        selections = {};
        saveSelections();

        // Reset visible UI
        const cards = gallery.querySelectorAll(".design-card");
        cards.forEach(card => {
          card.classList.remove("selected");
          const cb = card.querySelector(".design-select");
          const q = card.querySelector(".design-qty");
          if (cb) cb.checked = false;
          if (q) q.value = "0";
        });
      });

      // Vague, case-insensitive search (ignores punctuation, hyphens, etc.)
      searchInput.addEventListener("input", () => {
        const qRaw = searchInput.value.trim().toLowerCase();
        const s = qRaw.replace(/[^a-z0-9]+/g, "");

        gallery.innerHTML = "";
        count = 0;

        if (!s) {
          // no search → show everything
          filtered = all.slice();
        } else {
          // filter by loose match
          filtered = all.filter(d => {
            return d.search.includes(qRaw) || d.norm.includes(s);
          });
        }

        // Do NOT delete selections here: they persist even if currently filtered out
        loadMoreBtn.style.display = filtered.length > PAGE_SIZE ? "inline-block" : "none";
        renderMore();
      });

      loadMoreBtn.addEventListener("click", renderMore);

      document.getElementById("orderForm").addEventListener("submit", e => {
        const items = Object.entries(selections)
          .map(([k, v]) => {
            const d = all.find(x => String(x.key) === k);
            return d ? `${d.display} x ${v}` : "";
          })
          .filter(Boolean);

        if (!items.length) {
          e.preventDefault();
          formStatus.textContent = "Select at least one sticker.";
          formStatus.classList.add("error");
          return;
        }

        // Put clean list into the hidden field
        itemsField.value = items.join("\n");
        // We don't touch any of the visible inputs; no disabling required
      });

      window.addEventListener("resize", padGrid);
    });
  </script>

</body>
</html>
