<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omni-Cult Sticker Order Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --oc-green: #22c55e;
      --oc-green2: #16a34a;
      /* tweak these two if you want closer to your exact logo pink + glow */
      --oc-pink: #f472b6;
      --oc-pink2: #ec4899;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f9fafb;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    .logo-wrapper {
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .logo {
      max-width: 520px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .logo-caption {
      margin-top: 4px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    header p {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .card {
      background: #0b1120;
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid #1f2937;
      margin-bottom: 12px;
    }

    .order-grid { display: grid; gap: 10px; }
    @media (min-width: 720px) {
      .order-grid { grid-template-columns: repeat(2, 1fr); }
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }

    textarea { min-height: 70px; resize: vertical; }

    /* --- SEARCH: more prominent --- */
    .search-row {
      margin-top: 18px;
      margin-bottom: 6px;
    }
    .search-row label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: var(--oc-green);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .search-row input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 999px;
      border: 1px solid var(--oc-green);
      background: #020617;
      color: #f9fafb;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 0 0 1px rgba(34,197,94,0.25);
    }
    .search-row input::placeholder {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    /* FIXED EVEN GRID */
    .gallery {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 14px;
    }
    @media (min-width: 900px) {
      .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .design-card {
      border-radius: 10px;
      padding: 6px 6px 24px; /* bottom padding so remove button doesn't change height */
      border: 1px solid #1f2937;
      background: #020617;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      position: relative; /* for bottom-right remove button */
    }

    /* Thicker green outline, no size change */
    .design-card.selected {
      border-color: var(--oc-green);
      outline: 2px solid var(--oc-green);
      outline-offset: 0;
      box-shadow: 0 0 6px rgba(34,197,94,0.5);
    }

    .design-card.placeholder {
      visibility: hidden;
      border: none;
      box-shadow: none;
      outline: none;
    }

    .thumb-wrapper {
      background: #020617;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .design-name {
      font-size: 0.75rem;
      text-align: center;
      color: #e5e7eb;
    }

    /* QTY centered */
    .design-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
      font-size: 0.7rem;
    }

    .qty-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .qty-label {
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .qty-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .design-controls select {
      padding: 4px 6px;
      font-size: 0.8rem;
      background: #020617;
      color: #f9fafb;
      border-radius: 6px;
      border: 1px solid #374151;
    }

    /* --- REUSABLE BUTTON STYLES --- */
    .green-btn {
      background: linear-gradient(135deg, var(--oc-green), var(--oc-green2));
      color: #020617;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(34,197,94,0.45);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: .15s ease;
    }
    .green-btn:hover {
      filter: brightness(1.12);
      box-shadow: 0 0 14px rgba(34,197,94,0.65);
    }

    .pink-btn {
      background: linear-gradient(135deg, var(--oc-pink), var(--oc-pink2));
      color: #020617;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(244,114,182,0.45);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: .15s ease;
    }
    .pink-btn:hover {
      filter: brightness(1.12);
      box-shadow: 0 0 14px rgba(244,114,182,0.65);
    }

    /* qty +/- buttons use green look but small size */
    .qty-btn {
      width: 24px;
      height: 24px;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Remove button: bottom-right, pink gradient */
    .remove-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      padding: 4px 10px;
      font-size: 0.7rem;
      display: none; /* only when selected */
      white-space: nowrap;
    }
    .design-card.selected .remove-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Submit button – big green gradient */
    .submit-btn {
      margin-top: 16px;
      padding: 12px 18px;
      font-size: 1rem;
      width: 100%;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .load-more-wrap {
      text-align: center;
      margin-top: 14px;
    }

    .load-more-btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .clear-all-btn {
      padding: 6px 14px;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .status {
      margin-top: 6px;
      font-size: 0.8rem;
    }
    .status.error { color: #fecaca; }

    .small-note { font-size: 0.75rem; color: #9ca3af; }

    .disclaimer {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 6px;
      text-align: right;
    }

    .selection-summary {
      margin-top: 6px;
      font-size: 1.05rem;
      font-weight: 800;
      text-align: right;
      color: var(--oc-green);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="logo-wrapper">
        <!-- logo.png lives next to index.html -->
        <img src="logo.png" alt="Omni-Cult logo" class="logo">
        <div class="logo-caption">Sticker order form</div>
      </div>
      <h1>Sticker Order Form</h1>
      <p>Select stickers, use +/− or the dropdown, and choose quantities (0–99). Colors may vary; pink line = sticker shape.</p>
    </header>

    <form
      id="orderForm"
      class="card"
      method="POST"
      action="https://formspree.io/f/mykdggqy"
    >
      <!-- redirect back to success page after submit -->
      <input
        type="hidden"
        name="_redirect"
        value="https://omnicultcs-droid.github.io/Omni-Cult-Sticker-Order-Form/success.html"
      />
      <!-- subject line in your inbox -->
      <input
        type="hidden"
        name="_subject"
        value="New Omni-Cult sticker order"
      />
      <!-- list of chosen items -->
      <input type="hidden" name="items" id="itemsField" />
      <!-- CC the customer (Formspree may ignore this on free plan, but it's safe) -->
      <input type="hidden" name="_cc" id="ccField" />

      <div class="order-grid">
        <div>
          <label>Name</label>
          <input name="name" type="text" required autocomplete="name">
        </div>
        <div>
          <label>Email</label>
          <input name="email" type="email" required autocomplete="email">
        </div>
      </div>

      <!-- Address block (all required) -->
      <div style="margin-top: 10px;">
        <label>Address</label>
        <input name="address" type="text" required autocomplete="street-address">
      </div>

      <div class="order-grid" style="margin-top: 10px;">
        <div>
          <label>City</label>
          <input name="city" type="text" required autocomplete="address-level2">
        </div>
        <div>
          <label>State / Province</label>
          <input name="state" type="text" required autocomplete="address-level1">
        </div>
      </div>

      <div class="order-grid" style="margin-top: 10px%;">
        <div>
          <label>Postal / ZIP Code</label>
          <input name="postal" type="text" required autocomplete="postal-code">
        </div>
        <div>
          <label>Country</label>
          <input name="country" type="text" required autocomplete="country-name">
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label>Order notes</label>
        <textarea name="notes"></textarea>
      </div>

      <div class="search-row">
        <label>Search stickers</label>
        <input id="searchInput" type="search" placeholder="Type to filter… e.g. germs, skull, anime" />
      </div>

      <div class="toolbar">
        <span id="galleryStatus" class="small-note"></span>
        <button type="button" id="clearAllBtn" class="clear-all-btn pink-btn">
          Remove all selections
        </button>
      </div>

      <div id="gallery" class="gallery"></div>

      <div class="load-more-wrap">
        <button type="button" id="loadMoreBtn" class="load-more-btn green-btn">LOAD MORE</button>
      </div>

      <p class="disclaimer">colors may vary; pink line = cutline.</p>
      <p id="selectionSummary" class="selection-summary">Total selected: 0 stickers</p>

      <button type="submit" class="submit-btn green-btn">Submit order</button>
      <div id="formStatus" class="status"></div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const PAGE_SIZE = 120;
      const STORAGE_KEY = "omnicult_sticker_order";
      const MIN_TOTAL = 200;

      const gallery = document.getElementById("gallery");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const searchInput = document.getElementById("searchInput");
      const itemsField = document.getElementById("itemsField");
      const formStatus = document.getElementById("formStatus");
      const galleryStatus = document.getElementById("galleryStatus");
      const clearAllBtn = document.getElementById("clearAllBtn");
      const orderForm = document.getElementById("orderForm");

      const emailInput = orderForm.querySelector('input[name="email"]');
      const nameInput = orderForm.querySelector('input[name="name"]');
      const notesInput = orderForm.querySelector('textarea[name="notes"]');
      const addressInput = orderForm.querySelector('input[name="address"]');
      const cityInput = orderForm.querySelector('input[name="city"]');
      const stateInput = orderForm.querySelector('input[name="state"]');
      const postalInput = orderForm.querySelector('input[name="postal"]');
      const countryInput = orderForm.querySelector('input[name="country"]');
      const ccField = document.getElementById("ccField");
      const selectionSummary = document.getElementById("selectionSummary");

      let all = [];        // all designs
      let filtered = [];   // filtered designs
      let count = 0;       // how many currently rendered
      let selections = {}; // { key: qty }

      loadMoreBtn.style.display = "none";

      // ---------- Local storage helpers ----------
      function persistState() {
        try {
          const payload = {
            selections,
            form: {
              name: nameInput.value || "",
              email: emailInput.value || "",
              notes: notesInput.value || "",
              address: addressInput.value || "",
              city: cityInput.value || "",
              state: stateInput.value || "",
              postal: postalInput.value || "",
              country: countryInput.value || ""
            }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (_) {
          // ignore storage errors
        }
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (data && data.selections) selections = data.selections || {};
          if (data && data.form) {
            if (data.form.name) nameInput.value = data.form.name;
            if (data.form.email) emailInput.value = data.form.email;
            if (data.form.notes) notesInput.value = data.form.notes;
            if (data.form.address) addressInput.value = data.form.address;
            if (data.form.city) cityInput.value = data.form.city;
            if (data.form.state) stateInput.value = data.form.state;
            if (data.form.postal) postalInput.value = data.form.postal;
            if (data.form.country) countryInput.value = data.form.country;
          }
        } catch (_) {
          // ignore
        }
      }

      // Save when user types in any form fields
      [nameInput, emailInput, notesInput,
       addressInput, cityInput, stateInput, postalInput, countryInput].forEach(el => {
        el.addEventListener("input", persistState);
      });

      // ---------- Fetch designs ----------
      fetch("designs.json")
        .then(r => r.json())
        .then(data => {
          all = data.map((d, i) => {
            const raw = d.img || d.image || d.src || d.file || "";
            const base = raw.substring(raw.lastIndexOf("/") + 1).replace(/\.[^.]+$/, "");
            const img = raw.includes("/") ? raw : "img/" + raw;
            return {
              key: String(i),
              name: base.toLowerCase(),
              display: base,
              img
            };
          });

          all.sort((a, b) => a.display.localeCompare(b.display));

          // Load saved selections & form values
          loadState();

          filtered = all.slice();
          resetAndRender();
        });

      // ---------- Rendering ----------
      function resetAndRender() {
        gallery.innerHTML = "";
        count = 0;
        if (filtered.length > PAGE_SIZE) {
          loadMoreBtn.style.display = "inline-block";
        } else {
          loadMoreBtn.style.display = filtered.length ? "inline-block" : "none";
        }
        renderMore();
        updateSelectionSummary();
      }

      function renderMore() {
        const next = filtered.slice(count, count + PAGE_SIZE);
        next.forEach(addCard);
        count += next.length;
        padGrid();
        updateGalleryStatus();
        if (count >= filtered.length) {
          loadMoreBtn.style.display = "none";
        }
      }

      function addCard(design) {
        const card = document.createElement("div");
        card.className = "design-card";

        const key = design.key;

        card.innerHTML = `
          <div class="thumb-wrapper"><img src="${design.img}" alt="${design.display}"></div>
          <div class="design-name">${design.display}</div>
          <div class="design-controls">
            <div class="qty-block">
              <div class="qty-label">QTY</div>
              <div class="qty-group">
                <button type="button" class="qty-btn green-btn qty-minus" data-key="${key}">−</button>
                <select class="qty-select" data-key="${key}">
                  ${Array.from({length: 100}, (_, x) => `<option value="${x}">${x}</option>`).join("")}
                </select>
                <button type="button" class="qty-btn green-btn qty-plus" data-key="${key}">+</button>
              </div>
            </div>
          </div>
          <button type="button" class="remove-btn pink-btn" data-key="${key}">Remove</button>
        `;

        const qty = card.querySelector(".qty-select");
        const minusBtn = card.querySelector(".qty-minus");
        const plusBtn = card.querySelector(".qty-plus");
        const removeBtn = card.querySelector(".remove-btn");

        // Apply saved selection if any
        const savedQty = selections[key];
        if (savedQty && savedQty > 0) {
          qty.value = String(savedQty);
          card.classList.add("selected");
        }

        qty.addEventListener("change", () => {
          const n = parseInt(qty.value, 10) || 0;
          updateSelection(key, n, card);
        });

        minusBtn.addEventListener("click", () => {
          let n = parseInt(qty.value, 10) || 0;
          if (n > 0) n -= 1;
          qty.value = String(n);
          updateSelection(key, n, card);
        });

        plusBtn.addEventListener("click", () => {
          let n = parseInt(qty.value, 10) || 0;
          if (n < 99) n += 1;
          qty.value = String(n);
          updateSelection(key, n, card);
        });

        removeBtn.addEventListener("click", () => {
          qty.value = "0";
          updateSelection(key, 0, card);
        });

        gallery.appendChild(card);
      }

      function updateSelection(key, qty, card) {
        if (qty > 0) {
          selections[key] = qty;
          card.classList.add("selected");
        } else {
          delete selections[key];
          card.classList.remove("selected");
        }

        if (Object.keys(selections).length > 0) {
          formStatus.textContent = "";
          formStatus.classList.remove("error");
        }

        updateSelectionSummary();
        persistState();
      }

      function updateSelectionSummary() {
        const total = Object.values(selections).reduce(
          (sum, n) => sum + (parseInt(n, 10) || 0),
          0
        );
        selectionSummary.textContent =
          "Total selected: " + total + " sticker" + (total === 1 ? "" : "s");
        return total;
      }

      function padGrid() {
        const cols = getComputedStyle(gallery).gridTemplateColumns.split(" ").length;
        const real = gallery.querySelectorAll(".design-card:not(.placeholder)").length;
        const rem = real % cols;
        gallery.querySelectorAll(".placeholder").forEach(p => p.remove());
        if (rem !== 0) {
          for (let i = 0; i < cols - rem; i++) {
            const ph = document.createElement("div");
            ph.className = "design-card placeholder";
            gallery.appendChild(ph);
          }
        }
      }

      function updateGalleryStatus() {
        if (!filtered.length) {
          galleryStatus.textContent = "No designs match that search.";
        } else {
          galleryStatus.textContent =
            "Showing " + Math.min(count, filtered.length) + " of " + filtered.length + " designs";
        }
      }

      window.addEventListener("resize", padGrid);

      // ---------- Search ----------
      searchInput.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase().trim();
        filtered = q
          ? all.filter(d => d.name.includes(q))
          : all.slice();

        resetAndRender();
      });

      // ---------- Load more ----------
      loadMoreBtn.addEventListener("click", renderMore);

      // ---------- Clear all selections ----------
      clearAllBtn.addEventListener("click", () => {
        if (!Object.keys(selections).length) return;

        const ok = window.confirm("Are you sure you want to remove all selected stickers?");
        if (!ok) return;

        selections = {};
        persistState();
        resetAndRender();
      });

      // ---------- Submit ----------
      orderForm.addEventListener("submit", e => {
        const entries = Object.entries(selections);
        if (!entries.length) {
          e.preventDefault();
          formStatus.textContent = "Select at least one sticker before submitting.";
          formStatus.classList.add("error");
          return;
        }

        const total = updateSelectionSummary();
        if (total < MIN_TOTAL) {
          e.preventDefault();
          const message =
            "A minimum of " + MIN_TOTAL + " stickers is required to proceed. " +
            "You currently have " + total + ".";
          alert(message);
          formStatus.textContent = message;
          formStatus.classList.add("error");
          return;
        }

        const lines = [];
        entries.forEach(([k, qty]) => {
          const d = all.find(x => x.key === k);
          if (!d) return;
          lines.push(`${d.display} x ${qty}`);
        });

        itemsField.value = lines.join("\n");

        // Try to CC the customer so they get a copy of the order
        ccField.value = (emailInput.value || "").trim();

        persistState();
      });
    });
  </script>

</body>
</html>
