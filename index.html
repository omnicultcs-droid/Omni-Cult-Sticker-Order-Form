<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omni-Cult Sticker Order Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --oc-green: #22c55e;
      --oc-green2: #16a34a;
      --oc-pink: #f472b6;
      --oc-pink2: #ec4899;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f9fafb;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    .logo-wrapper {
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .logo {
      max-width: 520px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .instruction-line {
      margin: 6px auto 0;
      max-width: 1200px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #d1fae5;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card {
      background: #0b1120;
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid #1f2937;
      margin-bottom: 12px;
    }

    .order-grid { display: grid; gap: 10px; }
    @media (min-width: 720px) {
      .order-grid { grid-template-columns: repeat(2, 1fr); }
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }

    textarea { min-height: 70px; resize: vertical; }

    .field-help {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* SEARCH */
    .search-row {
      margin-top: 18px;
      margin-bottom: 6px;
    }
    .search-row label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: var(--oc-green);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .search-row input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 999px;
      border: 1px solid var(--oc-green);
      background: #020617;
      color: #f9fafb;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 0 0 1px rgba(34,197,94,0.25);
    }
    .search-row input::placeholder {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .small-note { font-size: 0.75rem; color: #9ca3af; }

    /* GALLERY GRID */
    .gallery {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 14px;
    }
    @media (min-width: 900px) {
      .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .design-card {
      border-radius: 10px;
      padding: 6px 6px 30px;
      border: 1px solid #1f2937;
      background: #020617;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      position: relative;
    }

    .design-card.selected {
      border-color: var(--oc-green);
      outline: 2px solid var(--oc-green);
      box-shadow: 0 0 6px rgba(34,197,94,0.5);
    }

    .design-card.placeholder {
      visibility: hidden;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    .thumb-wrapper {
      background: #020617;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .design-name {
      font-size: 0.75rem;
      text-align: center;
      color: #e5e7eb;
    }

    /* QTY centered */
    .design-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
      font-size: 0.7rem;
    }

    .qty-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .qty-label {
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .qty-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .design-controls select {
      padding: 4px 6px;
      font-size: 0.8rem;
      background: #020617;
      color: #f9fafb;
      border-radius: 6px;
      border: 1px solid #374151;
    }

    .green-btn {
      background: linear-gradient(135deg, var(--oc-green), var(--oc-green2));
      color: #020617;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
    }

    .pink-btn {
      background: linear-gradient(135deg, var(--oc-pink), var(--oc-pink2));
      color: #020617;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
    }

    .submit-btn {
      margin-top: 16px;
      padding: 12px 18px;
      font-size: 1rem;
      width: 100%;
      letter-spacing: .04em;
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="logo-wrapper">
        <img src="logo.png" class="logo">
      </div>

      <h1>Sticker Order Form</h1>
      <p class="instruction-line">
        Select stickers using +/- or dropdown. 
        Minimum order 200 stickers.
      </p>
    </header>

    <!-- ⭐⭐⭐ THE ONLY LINE I CHANGED ⭐⭐⭐ -->
    <form
      id="orderForm"
      class="card"
      method="POST"
      action="https://script.google.com/macros/s/AKfycbwQ21D_YrSurKrH2VdmdjzMyEt7IUmlygZdDX2TQ2cP4oOYT7p5BWkhO7H3ndcID1F8xA/exec"
    >
      <input type="hidden" name="items" id="itemsField">
