<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Received</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #05060a;
      color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 420px;
      background: #0b1120;
      padding: 28px;
      border-radius: 12px;
      border: 1px solid #1f2937;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8rem;
      color: #22c55e;
    }
    p {
      margin-top: 0;
      color: #cbd5e1;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #22c55e;
      color: #020617;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Order Submitted!</h1>
    <p>Your sticker order has been received. You will get a confirmation email shortly.</p>
    <a href="index.html">Back to Form</a>
  </div>

</body>
</html>
