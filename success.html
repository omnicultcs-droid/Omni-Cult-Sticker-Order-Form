<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Submitted – Omni-Cult</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --oc-green: #22c55e;
      --oc-green2: #16a34a;
      --oc-pink: #f472b6;
      --oc-pink2: #ec4899;
    }

    body {
      margin: 0;
      padding: 0;
      background: #05060a;
      color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .page {
      max-width: 800px;
      margin: 40px auto;
      padding: 16px;
    }

    .logo {
      max-width: 420px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      color: var(--oc-green);
    }

    p {
      font-size: 1rem;
      color: #d1d5db;
      margin: 6px 0 18px;
      line-height: 1.6;
    }

    .green-btn {
      background: linear-gradient(135deg, var(--oc-green), var(--oc-green2));
      color: #020617;
      font-weight: 800;
      padding: 12px 22px;
      font-size: 1rem;
      border-radius: 999px;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      box-shadow: 0 0 10px rgba(34,197,94,0.45);
      transition: .15s ease;
    }

    .green-btn:hover {
      filter: brightness(1.12);
      box-shadow: 0 0 14px rgba(34,197,94,0.65);
    }

    .msg-box {
      margin-top: 20px;
      background: #0b1120;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
    }

  </style>
</head>

<body>
  <div class="page">

    <img src="logo.png" class="logo" alt="Omni-Cult Logo">

    <h1>Order Submitted</h1>

    <div class="msg-box">
      <p><strong>Your sticker order has been successfully submitted!</strong></p>
      <p>You will receive a confirmation email shortly.  
      We will review your selections and send your final invoice soon.</p>
      <p>Thank you for supporting Omni-Cult.</p>
    </div>

    <a href="index.html" class="green-btn">Return to Order Form</a>
  </div>
</body>
</html>
