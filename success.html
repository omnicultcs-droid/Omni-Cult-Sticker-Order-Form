<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Submitted</title>

  <style>
    body {
      margin: 0;
      background: #05060a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: #0b1120;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 30px 40px;
      max-width: 500px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.8rem;
      color: #22c55e;
    }

    p {
      margin: 0;
      font-size: 1rem;
      color: #cbd5e1;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      background: #22c55e;
      color: #020617;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Order Received</h1>
    <p>Thank you! Your sticker order has been successfully submitted.</p>
    <p>I’ll review it and email you if anything is missing.</p>

    <a href="index.html">Back to Order Form</a>
  </div>
</body>
</html>
